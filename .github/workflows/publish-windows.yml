name: Publish verified Windows build
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows build run ID
        required: true
        type: string
      version:
        description: Version without v prefix
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.run_id }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Validate build provenance
        id: build
        shell: python
        run: |
          import json,os,re,subprocess
          run_id=os.environ['BUILD_RUN_ID'];version=os.environ['RELEASE_VERSION']
          assert re.fullmatch(r'[0-9]+',run_id)
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',version)
          repo=os.environ['GH_REPO']
          run=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}']))
          assert run['conclusion']=='success' and run['status']=='completed'
          assert run['path']=='.github/workflows/windows-build.yml'
          assert run['head_repository']['full_name']==repo and run['head_branch']=='main'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"commit={run['head_sha']}\nartifact=WLR-OnAir-Windows-{run['run_number']}\n")
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.build.outputs.commit }}
          persist-credentials: false
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          name: ${{ steps.build.outputs.artifact }}
          github-token: ${{ github.token }}
          path: files
      - name: Verify and package
        shell: python
        run: |
          from pathlib import Path
          import ast,hashlib,json,os,zipfile
          p=Path('files');version=os.environ['RELEASE_VERSION']
          assert Path('VERSION').read_text().strip()==version
          manifest=json.loads(Path('SOURCE_MANIFEST.json').read_text())
          m=json.loads((p/'BUILD_MANIFEST.json').read_text())
          assert m['version']==version
          assert m['source_fingerprint']==manifest['source_fingerprint']
          assert (p/'BUILD_SUCCESS.txt').is_file()
          assert not (p/'BUILD_INCOMPLETE.txt').exists()
          # Historical successful runs used a two-role build. Verify against
          # the role table from the exact source commit recorded by Actions.
          tree=ast.parse(Path('build.py').read_text(encoding='utf-8'))
          roles,=[ast.literal_eval(node.value) for node in tree.body if isinstance(node,ast.Assign)
                  and any(isinstance(t,ast.Name) and t.id=='ROLES' for t in node.targets)]
          legacy={'ADMIN':'Admin','VIEWER':'Viewer'}
          assert roles in (legacy,legacy|{'MASTER':'MasterAdmin'})
          assert len(m['artifacts'])==len(roles)
          assert {a['role'] for a in m['artifacts']}==set(roles)
          for a in m['artifacts']:
              role=a['role'];label=roles[role]
              assert a['file']==f'{label}/WLR_OnAir_{label}.exe'
              assert hashlib.sha256((p/a['file']).read_bytes()).hexdigest()==a['sha256']
              report=json.loads((p/f'{label}_SELFTEST.json').read_text())
              assert report==a['checks']['frozen_self_test'] and report['ok'] is True
              assert report['role']==role and report['publisher_present'] is (role=='ADMIN')
              assert report['version']==version and report['source_fingerprint']==m['source_fingerprint']
          assert hashlib.sha256((p/m['update_zip']['file']).read_bytes()).hexdigest()==m['update_zip']['sha256']
          z=Path(f'WLR_OnAir_v{version}_Windows.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as archive:
              for f in sorted(p.rglob('*')):
                  if f.is_file(): archive.write(f,f.relative_to(p))
          digest=hashlib.sha256(z.read_bytes()).hexdigest()
          Path('WINDOWS_SHA256SUMS.txt').write_text(digest+'  '+z.name+'\n')
          labels='·'.join(roles.values())
          Path('release-notes.md').write_text(f'WLR OnAir v{version} Windows {labels} 실행파일.\n\nWindows Server 2022 / Python 3.12에서 EXE 생성과 자체점검을 통과했습니다. ZIP에는 역할별 실행파일, 업데이트 ZIP, 배포관리.cmd, 빌드 기록이 포함됩니다.\n\n실제 PC의 최초 설정·공유폴더·트레이·DPAPI·업데이트는 별도 확인 항목입니다. 운영 공유폴더에 자동 게시하지 않습니다.\n\n빌드: https://github.com/{os.environ["GH_REPO"]}/actions/runs/{os.environ["BUILD_RUN_ID"]}\n')
      - name: Publish download
        env:
          SOURCE_COMMIT: ${{ steps.build.outputs.commit }}
        run: |
          if gh release view "v$RELEASE_VERSION" --json isDraft,assets > release-state.json 2>/dev/null; then
            python -c 'import json; r=json.load(open("release-state.json")); assert r["isDraft"] and not r["assets"], "Published or populated releases are immutable"'
            test "$(gh api "repos/$GH_REPO/git/ref/tags/v$RELEASE_VERSION" --jq .object.sha)" = "$SOURCE_COMMIT"
          else
            gh release create "v$RELEASE_VERSION" --draft --target "$SOURCE_COMMIT" --title "WLR OnAir v$RELEASE_VERSION Windows" --notes-file release-notes.md
          fi
          gh release upload "v$RELEASE_VERSION" "WLR_OnAir_v${RELEASE_VERSION}_Windows.zip" WINDOWS_SHA256SUMS.txt
          gh release edit "v$RELEASE_VERSION" --draft=false --notes-file release-notes.md
