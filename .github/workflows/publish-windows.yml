name: Publish verified Windows build
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          repository: magachefdave-lgtm/davess
          run-id: 44056568087
          name: WLR-OnAir-Windows-2
          github-token: ${{ github.token }}
          path: files
      - name: Verify and package
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,zipfile
          p=Path('files')
          m=json.loads((p/'BUILD_MANIFEST.json').read_text())
          assert m['version']=='3.18.39'
          assert m['source_fingerprint']=='f079b9334b698a0ed6d5d8763113969877c1f439c7306bd66de9ac34bb1d184e'
          assert (p/'BUILD_SUCCESS.txt').is_file()
          assert not (p/'BUILD_INCOMPLETE.txt').exists()
          assert {a['role'] for a in m['artifacts']}=={'ADMIN','VIEWER'}
          for a in m['artifacts']:
              assert hashlib.sha256((p/a['file']).read_bytes()).hexdigest()==a['sha256']
              assert a['checks']['frozen_self_test']['ok'] is True
          assert hashlib.sha256((p/m['update_zip']['file']).read_bytes()).hexdigest()==m['update_zip']['sha256']
          z=Path('WLR_OnAir_v3.18.39_Windows.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as archive:
              for f in sorted(p.rglob('*')):
                  if f.is_file(): archive.write(f,f.relative_to(p))
          digest=hashlib.sha256(z.read_bytes()).hexdigest()
          Path('WINDOWS_SHA256SUMS.txt').write_text(digest+'  '+z.name+'\n')
          Path('release-notes.md').write_text('WLR OnAir v3.18.39 Windows Admin·Viewer 실행파일.\n\nWindows Server 2022 / Python 3.12.10에서 EXE 생성과 자체점검을 통과했습니다. ZIP에는 Admin, Viewer, 업데이트 ZIP, 배포관리.cmd, 빌드 기록이 포함됩니다.\n\n실제 PC의 최초 설정·공유폴더·트레이·DPAPI·업데이트는 별도 확인 항목입니다. 운영 공유폴더에 자동 게시하지 않습니다.\n\n빌드: https://github.com/magachefdave-lgtm/davess/actions/runs/44056568087\n')
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: magachefdave-lgtm/davess
        run: |
          if ! gh release view v3.18.39 >/dev/null 2>&1; then
            gh release create v3.18.39 --draft --target be769b9ceb79d2c6850db69f16e6eabc7d1a4ed3 --title 'WLR OnAir v3.18.39 Windows Admin and Viewer' --notes-file release-notes.md
          fi
          gh release upload v3.18.39 WLR_OnAir_v3.18.39_Windows.zip WINDOWS_SHA256SUMS.txt
          gh release edit v3.18.39 --draft=false --notes-file release-notes.md
