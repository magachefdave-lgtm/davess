name: Windows Admin, Viewer and MasterAdmin
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify unchanged source
        run: python -B build.py --check
      - name: Check Windows Browse dialog order
        run: python -B validation/v3.18.42_dialogs/windows_picker.py
      - name: Install pinned Windows build dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-build-py312.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Check Windows DPAPI and session notifications
        run: python -B validation/v3.18.49_dinner_master/windows_session.py
      - name: Build and run Admin, Viewer and MasterAdmin self-tests
        run: python -B -u build.py --output dist/windows
      - name: Verify release outputs
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          p = Path('dist/windows')
          assert (p/'BUILD_SUCCESS.txt').is_file()
          assert not (p/'BUILD_INCOMPLETE.txt').exists()
          m = json.loads((p/'BUILD_MANIFEST.json').read_text(encoding='utf-8'))
          roles = {'ADMIN':'Admin', 'VIEWER':'Viewer', 'MASTER':'MasterAdmin'}
          assert len(m['artifacts']) == len(roles)
          assert {a['role'] for a in m['artifacts']} == set(roles)
          for a in m['artifacts']:
              role = a['role']
              label = roles[role]
              assert a['file'] == f'{label}/WLR_OnAir_{label}.exe'
              assert hashlib.sha256((p/a['file']).read_bytes()).hexdigest() == a['sha256']
              report = json.loads((p/f'{label}_SELFTEST.json').read_text(encoding='utf-8'))
              assert report == a['checks']['frozen_self_test']
              assert report['ok'] is True and report['role'] == role
              assert report['publisher_present'] is (role == 'ADMIN')
              assert report['version'] == m['version'] and report['source_fingerprint'] == m['source_fingerprint']
          assert hashlib.sha256((p/m['update_zip']['file']).read_bytes()).hexdigest() == m['update_zip']['sha256']
          print('Admin, Viewer, MasterAdmin, self-tests and update ZIP verified:', m['version'])
      - name: Start and verify all three frozen applications on temporary profiles
        timeout-minutes: 3
        run: python -B validation/v3.18.49_dinner_master/windows_runtime.py dist/windows
      - uses: actions/upload-artifact@v4
        with:
          name: WLR-OnAir-Windows-${{ github.run_number }}
          path: dist/windows/
          if-no-files-found: error
          retention-days: 30
      - name: Save diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics-${{ github.run_number }}
          path: |
            dist/windows/*.log
            dist/windows/*SELFTEST.json
            dist/windows/BUILD_INCOMPLETE.txt
          if-no-files-found: ignore
          retention-days: 14
