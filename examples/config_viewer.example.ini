; WLR OnAir 설정 예시. 관리자 암호·포트·접속 이름·추가 백업 폴더는 프로그램 화면의
; [연결 정보] → "자주 바꾸는 설정"에서 바꿀 수 있습니다(원본 사본을 남기고 저장). 바꾼 뒤에는 다시 시작하세요.
[NETWORK]
shared_folder_path =
server_port = 8001
db_timeout_seconds = 30.0
bind_host = 127.0.0.1
admin_password =
open_browser = true
tray_icon = true
; (선택, 3.17.13) 다른 PC 가 DNS 별칭(CNAME 등)으로 이 PC 에 접속할 때만 그 이름을 적습니다. 쉼표로 구분.
; localhost, IP 주소, 이 PC 의 이름은 적지 않아도 허용됩니다. '*' 는 이름 검사를 끕니다(권장하지 않음).
; 바꾼 뒤에는 프로그램을 다시 실행해야 적용됩니다.
; allowed_hosts = onair-server, onair-server.corp.example.com

; [UPDATE] (선택) 느린 PC 에서 새 버전 시작 확인이 시간 초과되면 늘립니다(초, 30~600).
; 시작에 실패해 막힌 업데이트를 다시 허용하려면 이 파일을 고치지 말고 [연결 정보] → "차단된 업데이트 다시 허용" 버튼을 누르세요.
; [UPDATE]
; startup_timeout_seconds = 120
